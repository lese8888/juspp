<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游闻 · 游戏情报台</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
    :root{--bg:#10110f;--panel:#181a17;--panel2:#20221e;--line:#30332d;--text:#f3f2ec;--muted:#94988d;--lime:#d5ff62;--orange:#ff9f64;--blue:#8cc8ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,'Noto Sans SC',sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}.app{max-width:1440px;margin:auto;padding:0 36px}.top{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}.brand i{width:28px;height:28px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:#151710;font-style:normal}.brand span,.eyebrow,.date,.time,.tag,.source,.rank,.eventtime{font-family:'DM Mono',monospace}.brand span{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-left:6px}.topright{display:flex;align-items:center;gap:20px;color:var(--muted);font-size:12px}.live{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:var(--lime);border-radius:50%;box-shadow:0 0 12px #d5ff6288}.avatar{width:32px;height:32px;background:#30352a;color:var(--lime);border-radius:50%;display:grid;place-items:center;font-weight:700}.layout{display:grid;grid-template-columns:205px 1fr;gap:42px;padding-top:34px}.side{border-right:1px solid var(--line);padding-right:24px}.side-title{font:500 10px 'DM Mono';letter-spacing:.15em;color:#686d62;margin:14px 0}.nav{width:100%;display:flex;gap:11px;align-items:center;padding:12px 13px;margin:4px 0;color:var(--muted);font-size:13px;border-radius:8px;border:0;background:transparent;text-align:left}.nav:hover,.nav.active{background:#292d20;color:var(--lime)}.nav b{margin-left:auto;font:11px 'DM Mono';opacity:.75}.side-note{margin-top:50px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:11px;line-height:1.7}.side-note strong{color:#dedfd6;display:block;font-size:12px;margin-bottom:7px}.main{padding-bottom:70px}.eyebrow{font-size:10px;color:var(--lime);letter-spacing:.16em}.headline{display:flex;justify-content:space-between;align-items:end;margin:18px 0 26px}.headline h1{font-size:34px;line-height:1.2;margin:0 0 8px}.headline p{margin:0;color:var(--muted);font-size:13px}.date{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:10px 13px;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px 18px}.stat label{color:var(--muted);font-size:11px}.stat strong{font-size:26px;display:block;margin:10px 0 4px}.stat small{font-size:10px;color:var(--lime)}.content{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.85fr);gap:14px;margin-top:16px}.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.boxhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.boxhead h2{font-size:13px;margin:0}.boxhead span{font:10px 'DM Mono';color:var(--muted)}.filters{display:flex;gap:7px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.filter{padding:6px 10px;border-radius:20px;background:none;border:1px solid var(--line);font-size:10px;color:var(--muted)}.filter:hover,.filter.sel{background:var(--lime);color:#151710;border-color:var(--lime);font-weight:700}.story{padding:17px 19px;border-bottom:1px solid #292b27;display:grid;grid-template-columns:65px 1fr;gap:14px;cursor:pointer;transition:background .18s}.story:hover,.story:focus{background:#20221e;outline:none}.story:focus-visible{box-shadow:inset 0 0 0 2px var(--lime)}.story:last-child{border:0}.time{font-size:10px;color:#73786d;padding-top:3px}.storybody{min-width:0}.storytop{display:flex;justify-content:space-between;align-items:start;gap:10px}.tag{font-size:9px;padding:4px 7px;border-radius:4px;display:inline-block;background:#253122;color:var(--lime);margin-bottom:8px}.tag.blue{background:#202d38;color:var(--blue)}.story h3{font-size:13px;line-height:1.55;margin:0 0 6px}.story p{font-size:11px;color:var(--muted);line-height:1.65;margin:0}.source{font-size:9px;color:#787d72;margin-top:9px}.save{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);padding:4px 8px;font-size:12px;white-space:nowrap}.save:hover,.save.saved{color:var(--lime);border-color:#596342}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.trend{padding:17px 18px}.trendrow{width:100%;display:flex;align-items:center;gap:10px;margin:14px 0;background:none;border:0;text-align:left;padding:0}.trendrow:hover .trendname{color:var(--lime)}.rank{font-size:10px;color:#6e7368;width:14px}.trendname{font-size:11px;flex:1}.bar{height:4px;background:#30332d;border-radius:3px;width:74px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);border-radius:3px}.trendrow small{font:9px 'DM Mono';color:var(--muted);width:23px;text-align:right}.schedule{border-top:1px solid var(--line);padding:17px 18px}.schedule h3{font-size:12px;margin:0 0 15px}.event{display:flex;gap:11px;margin:13px 0;padding:0;width:100%;background:none;border:0;text-align:left}.event:hover .eventtitle{color:var(--lime)}.eventtime{font-size:9px;color:var(--lime);width:42px;padding-top:2px}.eventtitle{font-size:10px;line-height:1.5;color:#dedfd6}.eventtitle small{display:block;color:var(--muted);font-size:9px}.foot{font:9px 'DM Mono';color:#666b61;margin-top:17px;text-align:right}.detail{width:min(760px,calc(100% - 28px));max-height:88vh;padding:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px}.detail::backdrop{background:#080907d9;backdrop-filter:blur(5px)}.detail-head{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.detail-head span{font:10px 'DM Mono';color:var(--lime);letter-spacing:.12em}.detail-close{background:none;border:1px solid var(--line);border-radius:7px;padding:7px 10px}.detail-body{padding:24px}.detail-body h2{font-size:24px;line-height:1.45;margin:0 0 10px}.detail-meta{font:11px 'DM Mono';color:var(--muted);margin-bottom:20px}.detail-summary{color:#c5c7be;line-height:1.8;font-size:14px}.script-box{white-space:pre-line;background:#11130f;border:1px solid var(--line);border-radius:10px;padding:18px;line-height:1.9;font-size:14px;margin:18px 0}.source-link{color:var(--lime);font-size:13px;text-decoration:none}.detail-hint{font-size:11px;color:var(--muted);margin-top:12px}
    @media(max-width:900px){.app{padding:0 20px}.layout{grid-template-columns:1fr;gap:20px}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px;gap:4px}.side-title,.side-note{display:none}.nav{white-space:nowrap;margin:0;width:auto}.content{grid-template-columns:1fr}}
    @media(max-width:600px){.app{padding:0 14px}.top{height:65px}.topright .live{display:none}.layout{padding-top:20px}.headline{align-items:start;gap:10px;flex-direction:column}.headline h1{font-size:28px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.story{grid-template-columns:46px 1fr;padding:14px 13px}.date{font-size:9px}.detail-body{padding:18px}.detail-body h2{font-size:20px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="brand"><i>游</i> 游闻 <span>INTEL DAILY</span></div><div class="topright"><div class="live"><i class="dot"></i>实时新闻</div><span>每 5 分钟采集</span><div class="avatar">游</div></div></header>
    <div class="layout">
      <aside class="side"><div class="side-title">工作台</div>
        <button class="nav active" data-view="daily">◈　每日简报</button>
        <button class="nav" data-view="all">▤　全部情报</button>
        <button class="nav" data-view="company"><svg class="nav-icon" width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 17.5h15M4 17V8l4-3v12m0 0V3h5v14m0 0V9l3-2v10M6 9h.1M6 12h.1M10 6h.1M10 9h.1M15 11h.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>公司动态</button>
        <button class="nav" data-view="releases">◷　发售与促销</button>
        <button class="nav" data-view="saved">☆　选题收藏 <b id="saved-count">0</b></button>
        <div class="side-note"><strong>情报范围</strong>全球游戏媒体与厂商公告<br>过去 24 小时 · 中文整理</div>
      </aside>
      <main class="main">
        <div class="eyebrow">DAILY GAME INTELLIGENCE</div>
        <div class="headline"><div><h1>今天的游戏情报</h1><p>点击新闻卡片查看视频文案，点击星标收藏选题。</p></div><div class="date">载入中…</div></div>
        <section class="stats">
          <div class="stat"><label>今日收录</label><strong id="stat-total">—</strong><small>过去 24 小时</small></div>
          <div class="stat"><label>重点新闻</label><strong id="stat-featured">—</strong><small>按新闻条数展示</small></div>
          <div class="stat"><label>覆盖来源</label><strong id="stat-sources">—</strong><small>媒体与官方公告</small></div>
          <div class="stat"><label>待核实传闻</label><strong>—</strong><small>以来源原文为准</small></div>
        </section>
        <div class="content">
          <section class="box"><div class="boxhead"><h2 id="list-title">今日重点情报</h2><span id="list-count"></span></div>
            <div class="filters"><button class="filter sel" data-kind="all">全部</button><button class="filter" data-kind="industry">媒体报道</button><button class="filter" data-kind="studio">官方公告</button><button class="filter" data-kind="releases">发售与促销</button></div>
            <div id="story-list"></div><div class="empty" id="empty" hidden>这个分类暂无新闻。试试“全部情报”或稍后刷新。</div>
          </section>
          <aside class="box"><div class="boxhead"><h2>话题热度</h2><span>按本期新闻分类</span></div><div class="trend" id="trend-list"></div>
            <div class="schedule"><h3>重点跟进</h3><div id="follow-list"></div></div>
          </aside>
        </div>
        <div class="foot"></div>
      </main>
    </div>
  </div>
  <dialog class="detail" aria-labelledby="detail-title"><div class="detail-head"><span>视频文案 · NEWS TO VIDEO</span><button class="detail-close" type="button">关闭 ×</button></div><div class="detail-body"><span class="tag" id="detail-category"></span><h2 id="detail-title"></h2><div class="detail-meta" id="detail-meta"></div><p class="detail-summary" id="detail-summary"></p><div class="script-box" id="detail-script"></div><a class="source-link" id="detail-source" target="_blank" rel="noopener">查看新闻原文 ↗</a><p class="detail-hint">文案根据新闻原文整理；制作发布前请核对原文与最新进展。</p></div></dialog>
  <script>
    const $=selector=>document.querySelector(selector);
    const storyList=$('#story-list');
    const detail=$('.detail');
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let articles=[];
    let currentKind='all';
    let currentView='daily';
    let selectedCategory='';
    let savedIds=new Set(JSON.parse(localStorage.getItem('game-intel-saved')||'[]'));
    const idOf=item=>item.url;
    const releaseCategories=['新作与发售','促销与平台'];
    function openDetail(item){$('#detail-category').textContent=item.category;$('#detail-title').textContent=item.title;$('#detail-meta').textContent=`${item.source} · ${new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',dateStyle:'medium',timeStyle:'short'}).format(new Date(item.timestamp))} HKT`;$('#detail-summary').textContent=item.summary||'';$('#detail-script').textContent=item.videoScript||`【开场】${item.title}。\n【正文】${item.summary||'打开新闻原文了解详情。'}\n【收尾】以上信息来自${item.source}，具体内容请查看原文。`;$('#detail-source').href=item.url;detail.showModal()}
    function isRelease(item){return releaseCategories.includes(item.category)}
    function matches(item){if(currentView==='saved'&&!savedIds.has(idOf(item)))return false;if(currentView==='company'&&!/公司|行业|商业/.test(item.category))return false;if(currentView==='releases'&&!isRelease(item))return false;if(selectedCategory&&item.category!==selectedCategory)return false;if(currentKind==='industry'&&item.sourceType!=='媒体')return false;if(currentKind==='studio'&&item.sourceType!=='官方')return false;if(currentKind==='releases'&&!isRelease(item))return false;return true}
    function renderStories(){const visible=articles.filter(matches);storyList.replaceChildren();$('#empty').hidden=visible.length>0;$('#list-count').textContent=`${visible.length} 条`;
      for(const item of visible){const card=document.createElement('article');card.className='story';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`打开视频文案：${item.title}`);const time=new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit'}).format(new Date(item.timestamp));const saved=savedIds.has(idOf(item));card.innerHTML=`<div class="time">${time}</div><div class="storybody"><div class="storytop"><div><span class="tag ${item.sourceType==='官方'?'blue':''}">${esc(item.category)}</span><h3>${esc(item.title)}</h3></div><button class="save ${saved?'saved':''}" type="button" aria-label="${saved?'取消收藏':'收藏选题'}">${saved?'★':'☆'}</button></div><p>${esc(item.summary||'打开来源查看新闻详情。')}</p><div class="source">来源：${esc(item.source)}　·　点击查看视频文案 ↗</div></div>`;card.addEventListener('click',()=>openDetail(item));card.addEventListener('keydown',event=>{if(event.target===card&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openDetail(item)}});card.querySelector('.save').addEventListener('click',event=>{event.stopPropagation();if(savedIds.has(idOf(item)))savedIds.delete(idOf(item));else savedIds.add(idOf(item));localStorage.setItem('game-intel-saved',JSON.stringify([...savedIds]));$('#saved-count').textContent=savedIds.size;renderStories()});storyList.append(card)}
    }
    function renderTrends(){const counts=new Map();for(const item of articles)counts.set(item.category,(counts.get(item.category)||0)+1);const sorted=[...counts].sort((a,b)=>b[1]-a[1]);$('#trend-list').replaceChildren();for(const [index,[category,count]] of sorted.entries()){const row=document.createElement('button');row.className='trendrow';row.innerHTML=`<span class="rank">${String(index+1).padStart(2,'0')}</span><span class="trendname">${esc(category)}</span><span class="bar"><i style="width:${Math.round(count/Math.max(1,sorted[0][1])*100)}%"></i></span><small>${count}</small>`;row.addEventListener('click',()=>{selectedCategory=category;currentKind='all';currentView='all';$('#list-title').textContent=category;document.querySelectorAll('.nav').forEach(nav=>nav.classList.toggle('active',nav.dataset.view==='all'));document.querySelectorAll('.filter').forEach(button=>button.classList.toggle('sel',button.dataset.kind==='all'));renderStories()});$('#trend-list').append(row)}}
    function renderFollow(){const follow=articles.slice(0,3);$('#follow-list').replaceChildren();for(const [index,item] of follow.entries()){const row=document.createElement('button');row.className='event';row.innerHTML=`<span class="eventtime">${String(index+1).padStart(2,'0')}</span><span class="eventtitle">${esc(item.title)}<small>${esc(item.category)} · 查看视频文案</small></span>`;row.addEventListener('click',()=>openDetail(item));$('#follow-list').append(row)}}
    function setView(view){currentView=view;selectedCategory='';currentKind='all';const labels={daily:'今日重点情报',all:'全部情报',company:'公司动态',releases:'发售与促销',saved:'选题收藏'};$('#list-title').textContent=labels[view];document.querySelectorAll('.nav').forEach(nav=>nav.classList.toggle('active',nav.dataset.view===view));document.querySelectorAll('.filter').forEach(button=>button.classList.toggle('sel',button.dataset.kind==='all'));renderStories()}
    document.querySelectorAll('.nav').forEach(nav=>nav.addEventListener('click',()=>setView(nav.dataset.view)));
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{currentKind=button.dataset.kind;selectedCategory='';document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('sel',item===button));renderStories()}));
    $('.detail-close').addEventListener('click',()=>detail.close());detail.addEventListener('click',event=>{if(event.target===detail)detail.close()});
    let lastReportAt='';
    function applyReport(report){if(report.generatedAt===lastReportAt)return;lastReportAt=report.generatedAt;articles=report.articles||[];$('#stat-total').textContent=articles.length;$('#stat-featured').textContent=Math.min(articles.length,5);$('#stat-sources').textContent=new Set(articles.map(item=>item.source)).size;$('#saved-count').textContent=savedIds.size;$('.date').textContent=`${new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',dateStyle:'medium',timeStyle:'short'}).format(new Date(report.generatedAt))} HKT`;$('.foot').textContent=`最近采集：${$('.date').textContent} · ${articles.length} 条新闻 · 每分钟检查更新`;renderStories();renderTrends();renderFollow()}
    async function refreshNews(allowStaticFallback=false){try{let response=await fetch('./api/news.json',{cache:'no-store'});if(!response.ok&&allowStaticFallback)response=await fetch('./news.json',{cache:'no-store'});if(!response.ok)throw new Error('新闻数据暂不可用');applyReport(await response.json())}catch{if(!lastReportAt){$('#empty').hidden=false;$('#empty').textContent='新闻数据暂不可用，请稍后刷新。'}}}
    refreshNews(true);setInterval(()=>refreshNews(false),60*1000);
  </script>
</body>
</html>
