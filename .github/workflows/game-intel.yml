name: 游闻多语言新闻采集

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: game-news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 缓存离线翻译模型
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: ${{ runner.os }}-argos-en-zh-ja-ko-${{ hashFiles('requirements.txt') }}
      - name: 安装采集、翻译与邮件依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 安装 Node 依赖
        run: npm install --no-audit --no-fund
      - name: 运行采集前语法检查
        run: npm run check:syntax
      - name: 运行 Scrapling 采集器测试
        run: npm run test:collector
      - name: 采集并生成五语数据
        env:
          COLLECT_SUMMARY_FILE: /tmp/collect-summary.json
          SEND_EMAIL: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://youwen-game-news.game-intel-brief.workers.dev/' }}
          PYTHON_EXECUTABLE: python
        run: npm run collect
      - name: 验证新闻发布时间新鲜度
        run: npm run verify:fresh
      - name: 运行采集后数据校验
        run: npm run check:data
      - name: 上传翻译标记诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: translation-marker-report
          path: ${{ runner.temp }}/youwen-translation-marker-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: 写入采集摘要
        if: always()
        env:
          COLLECT_SUMMARY_FILE: /tmp/collect-summary.json
        run: node scripts/write-collect-summary.mjs
      - name: 提交更新后的新闻数据
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json rss.xml
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m '更新游闻五语新闻数据'
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "推送遇到并发提交，尝试同步 main（第 $attempt 次）。"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "新闻数据与 main 分支上的其他更新发生冲突，停止提交。" >&2
              exit 1
            fi
          done
          if [ "$pushed" != "true" ]; then
            echo "连续重试后仍无法推送新闻数据。" >&2
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: 触发页面发布
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
