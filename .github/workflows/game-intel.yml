name: 游闻多语言新闻采集

on:
  # 冻结期只允许人工触发；恢复前必须接入新闻冻结写入门禁。
  workflow_dispatch:
    inputs:
      translation_engine:
        description: 翻译引擎（生产默认 Argos）
        required: true
        default: argos
        type: choice
        options:
          - argos
          - llm

permissions:
  contents: write
  actions: write

concurrency:
  group: game-news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4
      - name: 确认生产分支
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "生产采集只能从 main 分支运行，当前为 $GITHUB_REF。" >&2
            exit 1
          fi
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 缓存离线翻译模型
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: ${{ runner.os }}-argos-en-zh-ja-ko-${{ hashFiles('requirements.txt') }}
      - name: 恢复 LLM 生产翻译缓存
        if: inputs.translation_engine == 'llm'
        uses: actions/cache/restore@v4
        with:
          path: .shadow-cache
          key: youwen-production-cache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            youwen-production-cache-v1-${{ runner.os }}-
      - name: 初始化 LLM 生产缓存目录
        if: inputs.translation_engine == 'llm'
        run: mkdir -p .shadow-cache
      - name: 安装采集、翻译与邮件依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 安装 Node 依赖
        run: npm install --no-audit --no-fund
      - name: 运行采集前语法检查
        run: npm run check:syntax
      - name: 运行 Scrapling 采集器测试
        run: npm run test:collector
      - name: 采集并生成五语数据
        env:
          COLLECT_SUMMARY_FILE: /tmp/collect-summary.json
          SEND_EMAIL: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://youwen-game-news.game-intel-brief.workers.dev/' }}
          PYTHON_EXECUTABLE: python
          TRANSLATION_ENGINE: ${{ inputs.translation_engine || 'argos' }}
          LLM_CACHE_DIR: .shadow-cache
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          LLM_TIMEOUT_SECONDS: '120'
          LLM_MAX_RETRIES: '3'
          LLM_CONCURRENCY: '3'
          LLM_JSON_MODE: '1'
          LLM_ARTICLE_OUTPUT_TOKENS: '16000'
          LLM_TEMPERATURE: '0.2'
          LLM_MAX_COST_CNY_PER_RUN: '20'
          LLM_HARD_DEADLINE_MINUTES: '60'
          LLM_PRICE_INPUT_CNY_PER_M: ${{ vars.LLM_PRICE_INPUT_CNY_PER_M || '2.0' }}
          LLM_PRICE_OUTPUT_CNY_PER_M: ${{ vars.LLM_PRICE_OUTPUT_CNY_PER_M || '8.0' }}
        run: npm run collect
      - name: 验证新闻发布时间新鲜度
        run: npm run verify:fresh
      - name: 校验冻结新闻未被修改
        run: npm run baseline:check -- --allow-appended-articles
      - name: 运行采集后数据校验
        run: npm run check:data
      - name: 上传翻译标记诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: translation-marker-report
          path: ${{ runner.temp }}/youwen-translation-marker-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: 写入采集摘要
        if: always()
        env:
          COLLECT_SUMMARY_FILE: /tmp/collect-summary.json
        run: node scripts/write-collect-summary.mjs
      - name: 保存 LLM 生产翻译缓存
        if: always() && inputs.translation_engine == 'llm'
        uses: actions/cache/save@v4
        with:
          path: .shadow-cache
          key: youwen-production-cache-v1-${{ runner.os }}-${{ github.run_id }}
      - name: 提交更新后的新闻数据
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json rss.xml
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m '更新游闻五语新闻数据'
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "推送遇到并发提交，尝试同步 main（第 $attempt 次）。"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "新闻数据与 main 分支上的其他更新发生冲突，停止提交。" >&2
              exit 1
            fi
          done
          if [ "$pushed" != "true" ]; then
            echo "连续重试后仍无法推送新闻数据。" >&2
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: 触发页面发布
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
