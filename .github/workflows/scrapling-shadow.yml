name: Scrapling 影子采集

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapling-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-scrapling.txt
      - name: 安装 Scrapling
        run: python -m pip install --disable-pip-version-check -r requirements-scrapling.txt
      - name: 运行离线单元测试
        run: python -m unittest tests.test_scrapling_shadow
      - name: 并行采集公开新闻元数据
        env:
          SCRAPLING_OUTPUT_FILE: /tmp/scrapling-shadow.json
          COMPARE_NEWS_FILE: news.json
        run: python scrapling_shadow.py
      - name: 保存影子采集结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-shadow-${{ github.run_id }}
          path: /tmp/scrapling-shadow.json
          if-no-files-found: warn
          retention-days: 14
