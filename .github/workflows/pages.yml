name: 发布游戏情报网页

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'news.json'
      - 'rss.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-intel-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取网页文件
        uses: actions/checkout@v4
      - name: 确认生产分支
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Pages 生产发布只能从 main 分支运行，当前为 $GITHUB_REF。" >&2
            exit 1
          fi
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 校验冻结新闻未被修改
        run: python scripts/check-news-baseline.py check --allow-appended-articles
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 准备网页发布目录
        run: mkdir -p _site && cp index.html news.json rss.xml _site/
      - name: 上传网页文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: 等待 Pages 制品索引
        run: sleep 10
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
