name: 游闻 LLM 影子验证

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 影子抽样文章数
        required: true
        default: '20'
      engine:
        description: 生成引擎
        required: true
        default: llm
        type: choice
        options:
          - llm
          - mock
      language:
        description: 仅生成一种目标语言
        required: true
        default: all
        type: choice
        options:
          - all
          - zh-CN
          - en
          - ja
          - ko
      content_mode:
        description: 内容模式
        required: true
        default: mixed
        type: choice
        options:
          - mixed
          - digest

permissions:
  contents: read

concurrency:
  group: game-intel-translation-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装影子任务依赖
        run: python -m pip install --disable-pip-version-check 'opencc-python-reimplemented>=0.1.7,<1'
      - name: 初始化影子产物
        run: |
          mkdir -p .shadow-output
          printf '%s\n' '{"status":"not_started","shadow":true,"productionFilesModified":false}' > .shadow-output/translation-report.json
      - name: 恢复影子翻译缓存
        uses: actions/cache@v4
        with:
          path: .shadow-cache
          key: youwen-shadow-cache-v1-${{ runner.os }}-${{ hashFiles('translation/**/*.py', 'shadow_translate.py', '.agent-baselines/news-75-1fd6c3b33383.json') }}
          restore-keys: |
            youwen-shadow-cache-v1-${{ runner.os }}-
      - name: 运行影子任务测试
        run: |
          python -m unittest \
            tests.test_shadow_mixed \
            tests.test_shadow_translation \
            tests.test_budget_limits \
            tests.test_llm_faults \
            tests.test_digest \
            tests.test_segmentation \
            tests.test_full_l10n \
            tests.test_translation_gates \
            tests.test_translation_cache
      - name: 生成影子候选
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          LLM_TIMEOUT_SECONDS: '120'
          LLM_MAX_RETRIES: '3'
          LLM_CONCURRENCY: '3'
          LLM_JSON_MODE: '1'
          LLM_ARTICLE_OUTPUT_TOKENS: '16000'
          LLM_TEMPERATURE: '0.2'
          LLM_MAX_COST_CNY_PER_RUN: '20'
          LLM_HARD_DEADLINE_MINUTES: '60'
          LLM_PRICE_INPUT_CNY_PER_M: ${{ vars.LLM_PRICE_INPUT_CNY_PER_M || '2.0' }}
          LLM_PRICE_OUTPUT_CNY_PER_M: ${{ vars.LLM_PRICE_OUTPUT_CNY_PER_M || '8.0' }}
        run: |
          if [ "${{ inputs.language }}" != "all" ]; then
            python shadow_translate.py \
              --engine "${{ inputs.engine }}" \
              --content-mode "${{ inputs.content_mode }}" \
              --limit "${{ inputs.limit }}" \
              --language "${{ inputs.language }}" \
              --input .agent-baselines/news-75-1fd6c3b33383.json \
              --cache-dir .shadow-cache \
              --max-cost-cny 20 \
              --hard-deadline-minutes 60
          else
            python shadow_translate.py \
              --engine "${{ inputs.engine }}" \
              --content-mode "${{ inputs.content_mode }}" \
              --limit "${{ inputs.limit }}" \
              --input .agent-baselines/news-75-1fd6c3b33383.json \
              --cache-dir .shadow-cache \
              --max-cost-cny 20 \
              --hard-deadline-minutes 60
          fi
      - name: 上传影子候选与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-shadow-${{ github.run_id }}
          path: .shadow-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: 写入影子任务摘要
        if: always()
        run: |
          {
            echo "## 游闻 LLM 影子验证"
            echo
            echo "- 引擎：${{ inputs.engine }}"
            echo "- 内容模式：${{ inputs.content_mode }}"
            echo "- 抽样数：${{ inputs.limit }}"
            echo "- 费用硬上限：¥20"
            echo "- 硬截止：60分钟"
            echo "- 生产文件：未修改"
            echo "- 发布动作：未执行"
            echo "- 候选数据：请下载本次 artifact 查看"
          } >> "$GITHUB_STEP_SUMMARY"
