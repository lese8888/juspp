services:
  - type: web
    name: game-intel
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/news.json
    disk:
      name: game-intel-news
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NEWS_FILE
        value: /var/data/news.json
      - key: CRAWL_INTERVAL_MS
        value: "300000"
      - key: NODE_VERSION
        value: "22"

